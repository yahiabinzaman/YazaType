[package]
name = "yazatype-windows"
version = "0.2.5"
edition = "2021"
authors = ["Yahia Bin Zaman <yahiabinzaman@gmail.com>"]
description = "YazaType - Native Avro Phonetic Bengali Input Method for Windows"
license = "MIT"

[dependencies]
riti = { git = "https://github.com/OpenBangla/riti.git" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading"
] }
once_cell = "1.19"

[build-dependencies]
winres = "0.1"

[[bin]]
name = "YazaType"
path = "src/main.rs"
